name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ''    }
          - { goos: linux,   goarch: arm64, ext: ''    }
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, ext: '.exe' }
          - { goos: darwin,  goarch: amd64, ext: ''    }
          - { goos: darwin,  goarch: arm64, ext: ''    }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          out="ronin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "$out" .
          echo "built $out"

      - name: Checksum
        run: |
          set -eu
          f="ronin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          sha256sum "$f" > "$f.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ronin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            ronin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
