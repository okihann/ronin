name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Check, build, cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check userscript syntax
        run: node --check userscript.js

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build (host)
        run: go build -trimpath -o ronin .

      - name: Cross-compile all release targets
        run: make cross

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ronin-binaries
          path: dist/
          if-no-files-found: error
